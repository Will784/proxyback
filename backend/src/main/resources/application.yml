server:
  port: ${PORT:8080}

spring:
  application:
    name: loghub-backend
  datasource:
    # Default: in-memory H2. In production set DB_URL=jdbc:postgresql://host:5432/db
    url: ${DB_URL:jdbc:h2:mem:loghub;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  seed:
    enabled: ${SEED_ENABLED:true}
  proxy:
    ingestion:
      capacity: 10
      refill-per-second: 2
      duplicate-window-seconds: 5
    trace:
      cache-capacity: 100
      cache-ttl-seconds: 60
    analytics:
      stats-ttl-seconds: 10
